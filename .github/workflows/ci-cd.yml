name: Fintech API CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Flask API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run automated tests
        run: |
          python -m pytest -v

  terraform-check:
    name: Validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Validate Terraform
        run: terraform validate

  docker-build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t eliteoperation-fintech:ci .

      - name: Run Docker container
        run: docker run -d --name fintech-api-test -p 5000:5000 eliteoperation-fintech:ci

      - name: Test API endpoints
        run: |
          for attempt in {1..10}; do
            if curl --fail http://localhost:5000/health; then
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:5000/
          curl --fail http://localhost:5000/health

      - name: Show container logs if tests fail
        if: failure()
        run: docker logs fintech-api-test

      - name: Stop and remove container
        if: always()
        run: |
          docker stop fintech-api-test || true
          docker rm fintech-api-test || true
  docker-publish:
    name: Publish Docker Image to Docker Hub
    runs-on: ubuntu-latest
    needs: [test, terraform-check, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ovodom/eliteoperation-fintech:latest
            ovodom/eliteoperation-fintech:${{ github.sha }}
